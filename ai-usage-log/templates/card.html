<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;background:#eef1f5;font-family:"Microsoft JhengHei","Noto Sans CJK TC","PingFang TC",sans-serif;color:#1d2433}
.card{width:980px;background:#fff}
.top{background:#1f2937;color:#e5e7eb;padding:10px 22px;font-size:13px;display:flex;justify-content:space-between}
.head{padding:16px 22px 6px;display:flex;gap:12px;align-items:center}
.no{font-size:22px;font-weight:700;color:#1f5fae}.title{font-size:19px;font-weight:700}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:700}
.tag.h{background:#fde8d7;color:#9a4a10}.tag.a{background:#e3eefb;color:#1f5fae}.tag.i{background:#eceff3;color:#4b5563}
.msg{margin:10px 22px 16px;border-radius:10px;padding:4px 18px 10px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.msg.user{background:#fff7ef;border:1px solid #f3d4b8}.msg.assistant{background:#f6f9fd;border:1px solid #d6e2f0}
.who{font-size:12.5px;font-weight:700;color:#5b6475;margin:10px 0 2px}
table{border-collapse:collapse;font-size:13.5px;margin:6px 0}th,td{border:1px solid #cfd6df;padding:4px 9px}th{background:#e8eef6}
code{background:#eef1f5;padding:1px 5px;border-radius:4px;font-size:13px}
pre{background:#eef1f5;padding:8px 12px;border-radius:6px;overflow-wrap:anywhere;white-space:pre-wrap}pre code{padding:0}
h1,h2,h3,h4{font-size:15px}
p{margin:6px 0}ul,ol{margin:4px 0;padding-left:22px}
.foot{padding:0 22px 14px;font-size:12px;color:#7a8291}
/* 深色主題：只覆寫顏色，版面與淺色完全相同 */
body.dark{background:#0d1117;color:#e6e9ef}
.dark .card{background:#161b22}
.dark .top{background:#0d1117;color:#c9d1d9;border-bottom:1px solid #30363d}
.dark .no{color:#6cb0ff}
.dark .tag.h{background:#4a2f17;color:#ffc58f}.dark .tag.a{background:#1b3556;color:#9ccaff}.dark .tag.i{background:#2a313c;color:#b4bcc9}
.dark .msg.user{background:#2a2118;border:1px solid #5c4128}.dark .msg.assistant{background:#18202c;border:1px solid #2f4259}
.dark .who{color:#9aa4b5}
.dark th,.dark td{border:1px solid #3a424e}.dark th{background:#222a35}
.dark code,.dark pre{background:#0d1117}
.dark .foot{color:#8b94a3}
</style></head><body class="{{THEME}}">
<div class="card" id="c">
<div class="top"><span>AI 使用紀錄節錄｜{{HEADER}}</span><span>由原始對話紀錄轉出，內容未修改</span></div>
<div class="head"><span class="no">{{NO}}</span><span class="title">{{TITLE}}</span><span class="tag {{KIND_CLASS}}">{{KIND}}</span></div>
{{BODY}}
<div class="foot">{{FOOT}}</div>
</div>
</body></html>
